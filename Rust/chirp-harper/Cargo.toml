[package]
name = "chirp-harper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "C interface to the Harper grammar checker for Chirp"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
harper-core = { version = "3.2.0", default-features = false, features = ["concurrent"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"`: lib.rs catches a failure inside Harper so it cannot end the app.
