name: Bug report
description: Something in Chirp doesn't work the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
        3. See …
  - type: dropdown
    id: feature
    attributes:
      label: Which part of Chirp?
      options:
        - Dictate
        - Record (meetings, calls, voice notes)
        - Write checks (underlines, Fix, Rephrase)
        - Read aloud
        - Summarize
        - Notes and search
        - Install or updates
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chirp version
      description: Chirp › About Chirp. "Send Feedback…" in the Help menu fills this in.
      placeholder: 0.2.0 (41)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and memory
      placeholder: MacBook Air M2, 16 GB
  - type: textarea
    id: log
    attributes:
      label: Log or screenshots
      description: Optional. Check them for anything private before you post. Issues are public.
