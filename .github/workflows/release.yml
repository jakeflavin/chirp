name: Release

# Push a tag like v0.3.0 (stable) or v0.3.0-beta.1 (beta). Docs/RELEASING.md has the details.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_KEY_PATH: ${{ runner.temp }}/sparkle.key
          BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/release.sh "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > build/release/notes.md
          prerelease=""
          [[ "$version" == *-beta* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" build/release/Chirp.dmg build/release/sparkle.json \
            --title "Chirp $version" --notes-file build/release/notes.md $prerelease

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"

  site:
    needs: release
    uses: ./.github/workflows/site.yml
