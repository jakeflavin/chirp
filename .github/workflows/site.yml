name: Site

# Publishes Site/ to GitHub Pages, with the update feed (appcast.xml) made fresh from the releases.
on:
  push:
    branches: [main]
    paths: ["Site/**", "Scripts/appcast.py"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Make the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I Scripts/appcast.py "$GITHUB_REPOSITORY" > Site/appcast.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Site
      - id: deployment
        uses: actions/deploy-pages@v4
